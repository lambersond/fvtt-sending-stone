name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the source of truth for the released version. The manifest is stamped from it
      # so a forgotten version bump in module.json cannot produce a mislabelled release.
      - name: Stamp the manifest
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          jq --arg version "${TAG#v}" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.stamped.json
          mv module.stamped.json module.json
          cat module.json

      - name: Build the archive
        run: |
          set -euo pipefail
          # The whole tree minus VCS, CI and development tools, rather than a hand-maintained
          # list: a package that gains or loses a directory needs no edit here, and zip cannot
          # fail with "nothing to do" over a path that does not exist. module.json must land at
          # the archive root.
          zip -r module.zip . \
            -x '.git/*' '.github/*' '.gitignore' 'tools/*' 'module.zip' '*.DS_Store'
          unzip -l module.zip

      # module.json is published as a loose asset so that the manifest URL above resolves.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" module.json module.zip \
            --title "$TAG" \
            --generate-notes
